[SERVICE]
    Flush 1
    Log_Level error

[INPUT]
    Name dummy
    Tag eventtime.utc
    Dummy {"message":"utc","datetime":"2026-01-02T00:04:05.123456+00:00"}
    Samples 1

[INPUT]
    Name dummy
    Tag eventtime.offset
    Dummy {"message":"offset","datetime":"2026-01-02T03:04:05.123456+03:00"}
    Samples 1

[INPUT]
    Name dummy
    Tag gl.nginx
    Dummy {"message":"nginx","msec":1767312245.789,"time_local":"02/Jan/2026:03:04:05 +0300"}
    Samples 1

[FILTER]
    Name lua
    Match *
    script /fluent-bit/etc/cleanup.lua
    call normalize_event_time

[OUTPUT]
    Name stdout
    Match *
    Format json_lines
    json_date_key observed_at
    json_date_format double
