# Invalid UTF-8 bytes in a request must not break the JSON record or lose fields.
[SERVICE]
    Log_Level    error
    Flush        1
    Grace        1
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name           tail
    Path           /fluent-bit/etc/tests/nginx-invalid-utf8.ndjson
    Tag            gl.nginx
    Read_from_Head On
    Exit_On_Eof    On

# Production order: sanitize, global JSON expansion, native marker, service include, common callbacks.
[FILTER]
    Name   lua
    Match  gl.nginx
    script /fluent-bit/etc/cleanup.lua
    call   sanitize_invalid_utf8

[FILTER]
    Name         parser
    Match        gl.*
    Key_Name     log
    Parser       json_default
    Reserve_Data On

[FILTER]
    Name      lua
    Match     gl.*
    script    /fluent-bit/etc/cleanup.lua
    call      tag_native_stderr

@INCLUDE /fluent-bit/etc/service.d/nginx.conf

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      infer_level

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      normalize_event_time

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      flatten_nested

[OUTPUT]
    Name   stdout
    Match  gl.nginx
    Format json_lines
