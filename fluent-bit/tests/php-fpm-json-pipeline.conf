# End-to-end check of generic PHP-FPM wrapped JSON with the REAL production filter order:
# 1) global json_default + native tag
# 2) the real service.d/php.conf generic parser path
# 3) level, event-time, and nested-field normalization
# The four Docker-like records are a wrapped JSON object, native non-JSON output,
# malformed wrapped JSON, and direct JSON serialized inside `log`.
# Run it for real (never --dry-run: that does not even load the Lua script) —
# see `make fluent-bit-php-json-pipeline-test`.
[SERVICE]
    Log_Level    error
    Flush        1
    Grace        1
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name    dummy
    Tag     gl.php
    Samples 1
    Rate    1
    Dummy   {"log":"NOTICE: PHP message: [debug] {\"message\":\"Wrapped JSON event\",\"context\":{\"safe_flag\":true,\"sequence\":7},\"level\":200,\"level_name\":\"INFO\"}","docker_service":"php"}

[INPUT]
    Name    dummy
    Tag     gl.php
    Samples 1
    Rate    1
    Dummy   {"log":"NOTICE: PHP message: not-json","docker_service":"php"}

[INPUT]
    Name    dummy
    Tag     gl.php
    Samples 1
    Rate    1
    Dummy   {"log":"NOTICE: PHP message: {not-json}","docker_service":"php"}

[INPUT]
    Name    dummy
    Tag     gl.php
    Samples 1
    Rate    1
    Dummy   {"log":"{\"message\":\"Direct JSON event\",\"context\":{\"safe_flag\":true}}","docker_service":"php"}

# Match the production order: global JSON expansion, native-path marker, then the
# real php service include before common level/time/flattening callbacks.
[FILTER]
    Name         parser
    Match        gl.*
    Key_Name     log
    Parser       json_default
    Reserve_Data On

[FILTER]
    Name      lua
    Match     gl.*
    script    /fluent-bit/etc/cleanup.lua
    call      tag_native_stderr

@INCLUDE /fluent-bit/etc/service.d/php.conf

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      infer_level

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      normalize_event_time

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      flatten_nested

[OUTPUT]
    Name   stdout
    Match  gl.php
    Format json_lines
