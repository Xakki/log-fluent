# Harbor tail: REAL harbor_syslog parser + identity + level filter, mirrors fluent-bit.conf.
# Run via `make fluent-bit-harbor-test` (never --dry-run: Lua is not loaded then).
[SERVICE]
    Log_Level    error
    Flush        1
    Grace        1
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name             tail
    Path             /fluent-bit/etc/tests/harbor-fixture/*.log
    Tag              gl.harbor
    Parser           harbor_syslog
    Read_from_Head   True
    Exit_On_Eof      True

[FILTER]
    Name   modify
    Match  gl.harbor
    Add    docker_project harbor

[FILTER]
    Name   lua
    Match  gl.harbor
    script /fluent-bit/etc/cleanup.lua
    call   harbor_level

[FILTER]
    Name   grep
    Match  gl.harbor
    Regex  level_name ^(WARNING|ERROR|CRITICAL|ALERT|EMERGENCY)$

[FILTER]
    Name   lua
    Match  *
    script /fluent-bit/etc/cleanup.lua
    call   infer_level

[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines
