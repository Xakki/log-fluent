# End-to-end check of the anonymous-identity path with the REAL parsers.conf:
# 1) exact legacy php-fpm envelope  -> typed fields, raw wrapper dropped
# 2) same envelope + extra context key -> untouched (the regex is the allowlist)
# 3) direct JSON already expanded by json_default -> typed fields, context dropped
# Run it for real (never --dry-run: that does not even load the Lua script) —
# see `make fluent-bit-anonid-pipeline-test`.
[SERVICE]
    Log_Level    error
    Flush        1
    Grace        1
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name    dummy
    Tag     gl.php
    Samples 1
    Rate    1
    Dummy   {"log":"NOTICE: PHP message: [debug] {\"message\":\"Anonymous API identity resolved\",\"context\":{\"auth_identity_type\":\"anonymous_ip\",\"identity_opaque\":true}}","log_kind":"native","docker_service":"php"}

[INPUT]
    Name    dummy
    Tag     gl.php
    Samples 1
    Rate    1
    Dummy   {"log":"NOTICE: PHP message: {\"message\":\"Anonymous API identity resolved\",\"context\":{\"auth_identity_type\":\"anonymous_ip\",\"identity_opaque\":true,\"remote_ip\":\"198.51.100.7\"}}","log_kind":"native","docker_service":"php"}

[INPUT]
    Name    dummy
    Tag     gl.php
    Samples 1
    Rate    1
    Dummy   {"message":"Anonymous API identity resolved","context":{"auth_identity_type":"anonymous_ip","identity_opaque":true},"log_kind":"native","docker_service":"php"}

[FILTER]
    Name         parser
    Match        gl.php
    Key_Name     log
    Parser       php_fpm_anonymous_identity
    Reserve_Data On
    Preserve_Key Off

[FILTER]
    Name      lua
    Match     gl.php
    script    /fluent-bit/etc/cleanup.lua
    call      sanitize_php_fpm_anonymous_identity

[OUTPUT]
    Name   stdout
    Match  gl.php
    Format json_lines
