# End-to-end nginx check: REAL parsers.conf + service.d/nginx.conf over synthetic records:
# legacy project key names, convertor request_line, canonical record, system noise
# (kept only when failing/slow), error-log notices/warnings. Run via
# `make fluent-bit-nginx-pipeline-test` (never --dry-run: Lua is not loaded then).
[SERVICE]
    Log_Level    error
    Flush        1
    Grace        1
    Parsers_File /fluent-bit/etc/parsers.conf

# legacy project format (sa-prod / unidoski style)
[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"{\"time_local\":\"03/Nov/2026:07:31:09 +0000\",\"remote_addr\":\"1.2.3.4\",\"remote_port\":\"51234\",\"x_forwarded_for\":\"9.9.9.9\",\"http_host\":\"a.example\",\"message\":\"GET /orders HTTP/1.1\",\"status\":200,\"body_bytes_sent\":5,\"http_referrer\":\"-\",\"http_user_agent\":\"UA/1\",\"request_time\":\"0.123\",\"request_length\":80,\"upstream_connect_time\":\"0.001\",\"upstream_header_time\":\"0.100\",\"upstream_response_time\":\"0.100, 0.020\"}","docker_service":"nginx"}

# convertor request_safe: no $request, only request_line
[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"{\"time_local\":\"03/Nov/2026:07:31:09 +0000\",\"remote_addr\":\"1.2.3.4\",\"message\":\"request\",\"request_uri\":\"/api/v1/convert?x=1\",\"request_line\":\"POST /api/v1/convert?x=1 HTTP/1.1\",\"request_line_b64\":\"AA==\",\"status\":201,\"request_time\":\"0.5\"}","docker_service":"nginx"}

# canonical shared format
[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"{\"time_local\":\"03/Nov/2026:07:31:09 +0000\",\"remote_addr\":\"1.2.3.4\",\"realip_remote_addr\":\"172.30.211.2\",\"request_host\":\"x.example\",\"server_name\":\"x.example\",\"message\":\"GET /robots.txt HTTP/2.0\",\"status\":200,\"request_time\":0.001,\"user_agent\":\"UA/2\",\"referer\":\"\",\"x_forwarded_for\":\"-\"}","docker_service":"nginx"}

# system noise, healthy: dropped
[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"{\"remote_addr\":\"1.2.3.4\",\"message\":\"POST /gelf HTTP/1.1\",\"status\":202,\"request_time\":0.002}","docker_service":"nginx"}

[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"{\"remote_addr\":\"1.2.3.4\",\"message\":\"GET /api/v1/internal/worker/command-pending HTTP/1.1\",\"status\":204,\"request_time\":0.002}","docker_service":"nginx"}

# system noise, failing: kept
[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"{\"remote_addr\":\"1.2.3.4\",\"message\":\"POST /gelf HTTP/1.1\",\"status\":502,\"request_time\":0.002}","docker_service":"nginx"}

# error log: warn about buffering (dropped), notice (dropped), real error (kept with context)
[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"2026/11/03 07:31:10 [warn] 21#21: *7 a client request body is buffered to a temporary file /x/1, client: 1.2.3.4, server: x, request: \"GET /a HTTP/1.1\", host: \"x\"","docker_service":"nginx"}

[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"2026/11/03 07:31:10 [notice] 1#1: signal 17 (SIGCHLD) received from 47","docker_service":"nginx"}

[INPUT]
    Name    dummy
    Tag     gl.nginx
    Samples 1
    Rate    1
    Dummy   {"log":"2026/11/03 07:31:10 [error] 21#21: *9 open() \"/x\" failed (2: No such file or directory), client: 1.2.3.4, server: x, request: \"GET /x HTTP/1.1\", host: \"x\"","docker_service":"nginx"}

# Production order: global JSON expansion, native marker, service include, common callbacks.
[FILTER]
    Name         parser
    Match        gl.*
    Key_Name     log
    Parser       json_default
    Reserve_Data On

[FILTER]
    Name      lua
    Match     gl.*
    script    /fluent-bit/etc/cleanup.lua
    call      tag_native_stderr

@INCLUDE /fluent-bit/etc/service.d/nginx.conf

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      infer_level

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      normalize_event_time

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      flatten_nested

[OUTPUT]
    Name   stdout
    Match  gl.nginx
    Format json_lines
