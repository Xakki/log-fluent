# End-to-end check of the host (non-docker) nginx tail: the INPUT and the identity FILTER
# mirror fluent-bit.conf, then the production nginx path (service.d/nginx.conf).
# Run via `make fluent-bit-host-nginx-test` (never --dry-run: Lua is not loaded then).
[SERVICE]
    Log_Level    error
    Flush        1
    Grace        1
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name             tail
    Path             /fluent-bit/etc/tests/host-nginx-fixture/*.log
    Path_Key         file
    Tag              gl.nginx
    Read_from_Head   True
    Exit_On_Eof      True

[FILTER]
    Name      modify
    Match     gl.nginx
    Condition Key_exists file
    Add       docker_service host-nginx
    Add       log_format nginx
    Add       docker_tier proxy
    Add       docker_container host-nginx
    Add       log_source file
    Remove    file

[FILTER]
    Name         parser
    Match        gl.*
    Key_Name     log
    Parser       json_default
    Reserve_Data On

[FILTER]
    Name      lua
    Match     gl.*
    script    /fluent-bit/etc/cleanup.lua
    call      tag_native_stderr

@INCLUDE /fluent-bit/etc/service.d/nginx.conf

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      infer_level

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      normalize_event_time

[FILTER]
    Name      lua
    Match     *
    script    /fluent-bit/etc/cleanup.lua
    call      flatten_nested

[OUTPUT]
    Name   stdout
    Match  gl.nginx
    Format json_lines
