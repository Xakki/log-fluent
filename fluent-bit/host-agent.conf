# Standalone fluent-bit for a host WITHOUT docker: tails the host nginx logs and runs the
# very same nginx path (cleanup.lua + service.d/nginx.conf) as the container pipeline.
#
# Install (binary package, same version as the image):
#   /opt/log-fluent                 checkout of this repo (git tag)
#   /fluent-bit/etc -> /opt/log-fluent/fluent-bit   (the lua/parser paths are absolute)
#   systemd: fluent-bit -c /fluent-bit/etc/host-agent.conf
#   env file: GRAYLOG_HOST GRAYLOG_PORT GRAYLOG_URI HOST_NAME HOST_IP COMPOSE_PROFILES
#
# Tails every *.log in /var/log/nginx; stream-sni.log (one line per TCP connection, no HTTP
# semantics) is excluded.
[SERVICE]
    Flush        3
    Log_Level    warn
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name             tail
    Path             /var/log/nginx/*.log
    Exclude_Path     /var/log/nginx/stream-sni.log
    Path_Key         file
    Tag              gl.nginx
    Read_from_Head   False
    DB               /var/lib/fluent-bit/host_nginx_tail.db
    Rotate_Wait      5
    Refresh_Interval 10
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   On

[FILTER]
    Name   modify
    Match  *
    Add    host ${HOST_IP}
    Add    hostname ${HOST_NAME}
    Add    docker_profile ${COMPOSE_PROFILES}

# Same identity the container path derives from compose labels (see fluent-bit.conf).
[FILTER]
    Name      modify
    Match     gl.nginx
    Condition Key_exists file
    Add       docker_service host-nginx
    Add       log_format nginx
    Add       docker_tier proxy
    Add       docker_container host-nginx
    Remove    file

[FILTER]
    Name   lua
    Match  gl.nginx
    script /fluent-bit/etc/cleanup.lua
    call   sanitize_invalid_utf8

[FILTER]
    Name         parser
    Match        gl.*
    Key_Name     log
    Parser       json_default
    Reserve_Data On

[FILTER]
    Name   lua
    Match  gl.*
    script /fluent-bit/etc/cleanup.lua
    call   tag_native_stderr

@INCLUDE /fluent-bit/etc/service.d/nginx.conf

[FILTER]
    Name   lua
    Match  *
    script /fluent-bit/etc/cleanup.lua
    call   infer_level

[FILTER]
    Name   lua
    Match  *
    script /fluent-bit/etc/cleanup.lua
    call   normalize_event_time

[FILTER]
    Name   lua
    Match  *
    script /fluent-bit/etc/cleanup.lua
    call   flatten_nested

[OUTPUT]
    Name             http
    Match            gl.*
    Host             ${GRAYLOG_HOST}
    Port             ${GRAYLOG_PORT}
    URI              ${GRAYLOG_URI}
    Format           gelf
    Gelf_Level_Key   syslog_severity
    tls              On
    tls.verify       On
    Retry_Limit      5
