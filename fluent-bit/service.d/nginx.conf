# gl.nginx — access JSON + error text, one canonical shape for all projects/hosts.
# Order matters: global json_default has already expanded access JSON into keys.

# Access: rename legacy keys (http_user_agent, http_host, ...), move request_line
# into message, coerce numeric fields. No-op on error-log records.
[FILTER]
    Name   lua
    Match  gl.nginx
    script /fluent-bit/etc/cleanup.lua
    call   normalize_nginx_access

# Access JSON: split "message" ("GET /uri HTTP/1.1") into method/uri/proto.
[FILTER]
    Name         parser
    Match        gl.nginx
    Key_Name     message
    Parser       nginx_request
    Reserve_Data On

# Drop healthy+fast system endpoints (/gelf, health, exporters, worker control).
[FILTER]
    Name   lua
    Match  gl.nginx
    script /fluent-bit/etc/cleanup.lua
    call   drop_nginx_access_noise

# Error text: "2024/12/30 12:34:56 [error] 1234#0: *5678 message". No-op on access
# JSON (its "log" is already gone).
[FILTER]
    Name         parser
    Match        gl.nginx
    Key_Name     log
    Parser       nginx_error
    Reserve_Data On

# Error log: drop notice/info/debug and "buffered to a temporary file" noise.
[FILTER]
    Name   lua
    Match  gl.nginx
    script /fluent-bit/etc/cleanup.lua
    call   drop_nginx_error_noise

# Split the error "tail" (", client: ..., request: \"...\", ...") into fields.
[FILTER]
    Name   lua
    Match  gl.nginx
    script /fluent-bit/etc/cleanup.lua
    call   parse_nginx_error_context

# Last: after the error tail is split into fields.
# Remove fields that repeat another field (realip == remote_addr, server_name == host).
[FILTER]
    Name   lua
    Match  gl.nginx
    script /fluent-bit/etc/cleanup.lua
    call   dedupe_nginx_fields

# Host nginx files have no docker stdout/stderr: mirror it, because the Graylog nginx
# streams split access/error by log_source (stdout = access JSON, stderr = error text).
[FILTER]
    Name   lua
    Match  gl.nginx
    script /fluent-bit/etc/cleanup.lua
    call   host_nginx_stream
