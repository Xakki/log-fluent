# Include in the location/server of a TLS-TERMINATING proxy that forwards requests to another nginx (second hop).
# The backend then logs the real client TLS/connection facts (x_client_* fields of json_combined) instead of the proxy's own.
#   - proxy_set_header ALWAYS overwrites a header sent by the client, so the values cannot be spoofed through the proxy;
#   - the backend must treat x_client_* as trustworthy ONLY on the listener that only the proxy can reach (separate port,
#     firewalled / allow-listed); on any other port they are client-supplied. The export decides by server_port.
# $ssl_* are empty when the proxy listener is plain HTTP; the headers are then sent empty.
proxy_set_header X-Client-SSL-Protocol $ssl_protocol;
proxy_set_header X-Client-SSL-Alpn $ssl_alpn_protocol;
proxy_set_header X-Client-SSL-Session-Reused $ssl_session_reused;
proxy_set_header X-Client-Connection-Requests $connection_requests;
