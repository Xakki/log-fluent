# Canonical TLS profile for every nginx host (single source of truth).
# Include it at http{} (or server{}) level instead of repeating ssl_* directives:
#   include /etc/nginx/tls_params.conf;
# Copy this file to /etc/nginx/tls_params.conf of the host (or into the mounted nginx dir of a
# container); do not edit the copy, change it here and re-copy.
#
# Not here on purpose (host-specific): ssl_certificate*, ssl_session_cache zone name/size,
# ssl_buffer_size, HSTS, http2/quic listeners. A host that must differ (e.g. a QUIC edge that wants
# session tickets for resumption) overrides the single directive AFTER the include, with a comment.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
# AEAD + ECDHE only (forward secrecy, no CBC/3DES/DHE). TLS 1.3 suites are not configurable here.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_timeout 1d;
# Ticket keys live as long as the nginx process and are never rotated -> resumed sessions lose
# forward secrecy. TLS 1.2 resumption still works through the server-side session cache
# (TLS 1.3 then does a full handshake: no extra RTT, only CPU).
ssl_session_tickets off;
