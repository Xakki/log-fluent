# HTTP/3 advertisement for hosts that terminate TLS themselves and serve UDP 443.
# Needs nginx >= 1.25 built with http_v3_module, UDP 443 open in the firewall, and in each server:
#   listen 443 quic reuseport;   # `reuseport` once per address:port, not per server
#   listen 443 ssl;              # keep TCP for h2/h1.1 fallback
#   include /etc/nginx/tls_http3.conf;
# Do not use behind a TCP SNI relay (stream ssl_preread): QUIC cannot be routed by SNI there.
# add_header is not inherited into a location that has its own add_header: repeat the include there.
add_header Alt-Svc 'h3=":443"; ma=86400' always;
